<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>로그인 · 건설인 AI Native</title>
  <link rel="icon" href="/images/ax-construction-logo.jpg" type="image/jpeg">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/construction.css">
  <script type="module" src="/js/theme.js"></script>
</head>
<body class="login-page">
  <header class="site-header"><div class="shell header-inner"><a class="brand" href="/"><img class="brand-logo" src="/images/ax-construction-logo.jpg" alt="건설인 AX 생존지식 로고" width="42" height="42"><span>건설인 AI Native</span></a><nav class="nav"><a href="/">프로그램 소개</a></nav></div></header>
  <main class="shell">
    <section class="card login-card" aria-labelledby="login-title">
      <div class="login-panel"><p class="eyebrow">WELCOME TO THE FIELD</p><h1 id="login-title">이제, 직접<br>만들어볼 시간입니다.</h1><p class="lead">일반 사용자와 관리자 모두 Google 계정으로 로그인합니다. 관리자 권한은 지정된 계정에만 부여됩니다.</p>
        <p id="login-status" class="notice" role="status" hidden></p>
        <div class="stack login-actions"><a class="btn google-login" href="/auth/google">사용자 · Google로 로그인 →</a><a class="btn secondary google-login" href="/auth/google">관리자 · Google로 로그인 →</a></div>
        <p class="tiny" style="margin-top:20px">신규 사용자는 가입 신청 후 관리자 승인 대기 상태가 됩니다. 관리자는 승인 없이 관리 화면으로 이동합니다.</p>
      </div>
      <aside class="login-visual theme-only" aria-label="건설 현장의 AI 업무 혁신"><div><span class="eyebrow">CONSTRUCTION × AI</span><p>현장에서 시작하는<br>나의 AI Native 업무방식.</p><span>12주 실행 프로젝트</span></div></aside>
    </section>
  </main>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
